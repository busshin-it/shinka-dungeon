name: Optimize game assets

on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/cards/**.png'
      - 'assets/characters/**.png'
      - 'assets/enemies/**.png'
      - 'tools/optimize_assets.py'
      - '.github/workflows/optimize-assets.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow
      - run: python tools/optimize_assets.py
      - name: Commit optimized assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/runtime
          git diff --cached --quiet || git commit -m "Optimize runtime image assets"
          git push
