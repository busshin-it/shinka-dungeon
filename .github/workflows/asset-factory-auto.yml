name: Asset Factory Auto

on:
  push:
    branches:
      - main
    paths:
      - '.asset-factory-trigger'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: asset-factory-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    if: ${{ vars.ASSET_FACTORY_AUTO_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ASSET_FACTORY_IMAGE_MODEL: ${{ vars.ASSET_FACTORY_IMAGE_MODEL || 'gpt-image-2' }}
      ASSET_FACTORY_TRANSPARENT_IMAGE_MODEL: ${{ vars.ASSET_FACTORY_TRANSPARENT_IMAGE_MODEL || 'gpt-image-2.5-flare' }}
      ASSET_FACTORY_QA_MODEL: ${{ vars.ASSET_FACTORY_QA_MODEL || 'gpt-5.6-luna' }}
      ASSET_FACTORY_IMAGE_QUALITY: medium
      ASSET_FACTORY_MAX_IMAGE_CALLS: '12'
      ASSET_FACTORY_MAX_TOTAL_ATTEMPTS: '8'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Verify secret
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY repository secret is required." >&2
            exit 1
          fi

      - name: Run self-healing Asset Factory queue
        shell: bash
        run: |
          node asset-factory/worker.mjs             --count 20             --max-retries 2             --max-total-attempts 8

      - name: Test queue tooling
        if: always()
        run: npm run test:asset-factory

      - name: Refresh project context
        if: always()
        run: node asset-factory/update-project-context.mjs

      - name: Commit generated assets and queue state
        if: always()
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "asset-factory[bot]"
          git config user.email "asset-factory[bot]@users.noreply.github.com"
          git add asset-factory/queue.json asset-factory/asset-manifest.json asset-factory/debug/ assets/ PROJECT_CONTEXT.md
          git commit -m "Asset Factory: automated generation pass"
          git push origin HEAD:main
