name: Asset Factory

on:
  workflow_dispatch:
    inputs:
      count:
        description: 'How many pending assets to process sequentially'
        required: true
        default: '3'
      asset_id:
        description: 'Optional single asset_id (leave blank for queue order)'
        required: false
        default: ''
      max_retries:
        description: 'Automatic QA regeneration attempts per asset'
        required: true
        default: '1'
      quality:
        description: 'Image quality'
        required: true
        default: 'medium'
        type: choice
        options:
          - low
          - medium
          - high

permissions:
  contents: write

concurrency:
  group: asset-factory-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ASSET_FACTORY_IMAGE_MODEL: ${{ vars.ASSET_FACTORY_IMAGE_MODEL || 'gpt-image-2' }}
      ASSET_FACTORY_QA_MODEL: ${{ vars.ASSET_FACTORY_QA_MODEL || 'gpt-5.6-luna' }}
      ASSET_FACTORY_IMAGE_QUALITY: ${{ inputs.quality }}
      ASSET_FACTORY_MAX_IMAGE_CALLS: '6'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify secret
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY repository secret is required." >&2
            exit 1
          fi

      - name: Run Asset Factory
        shell: bash
        run: |
          args=(--count "${{ inputs.count }}" --max-retries "${{ inputs.max_retries }}")
          if [ -n "${{ inputs.asset_id }}" ]; then
            args+=(--asset "${{ inputs.asset_id }}")
          fi
          node asset-factory/worker.mjs "${args[@]}"

      - name: Test queue tooling
        run: npm run test:asset-factory

      - name: Commit generated assets and queue state
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "asset-factory[bot]"
          git config user.email "asset-factory[bot]@users.noreply.github.com"
          git add asset-factory/queue.json assets/
          git commit -m "Asset Factory: generate queued assets"
          git push origin "HEAD:${GITHUB_REF_NAME}"
