<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>蒼星の回廊・表示確認</title><style>body{margin:0;padding:14px;background:#101a27;color:#e7edf6;font:14px system-ui,sans-serif}h1{font-size:18px;margin:0 0 7px}p{font-size:12px;margin:5px 0 10px;color:#c1cedc}.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}button{min-height:34px;padding:5px 10px;background:#223b54;color:#e8f3ff;border:1px solid #6d839c;border-radius:4px;font:inherit}button[aria-pressed=true]{background:#375f80;border-color:#c5eaff}.frame-box{width:max-content;max-width:none;line-height:0;outline:1px solid #7490a8;background:#030b11}iframe{display:block;border:0;width:740px;height:300px}output{font-size:12px;margin-left:8px}a{color:#bee7ff}</style></head><body><h1>表示サイズの確認</h1><p>CSSビューポートのシミュレーションです。実機・ネイティブタッチの確認ではありません。ゲームは1画面だけ開き、このブラウザの保存を使います。</p><div class="toolbar" aria-label="表示設定"><button type="button" data-mode="planning" aria-pressed="true">先読み32枚</button><button type="button" data-mode="legacy" aria-pressed="false">24枚</button><button type="button" data-size="740x300" aria-pressed="true">740 × 300</button><button type="button" data-size="740x360" aria-pressed="false">740 × 360</button><button type="button" data-size="844x390" aria-pressed="false">844 × 390</button><button type="button" data-size="640x280" aria-pressed="false">640 × 280</button><output id="dimensions">740 × 300 CSS px</output></div><div class="frame-box"><iframe id="game" title="蒼星の回廊・表示確認用ゲーム" src="../v4-1/planning.html"></iframe></div><script>(()=>{const frame=document.getElementById('game');document.querySelectorAll('[data-size]').forEach(b=>b.addEventListener('click',()=>{const[w,h]=b.dataset.size.split('x').map(Number);frame.style.width=w+'px';frame.style.height=h+'px';document.getElementById('dimensions').textContent=w+' × '+h+' CSS px';document.querySelectorAll('[data-size]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));}));document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{frame.src=b.dataset.mode==='planning'?'../v4-1/planning.html':'../v4-1/index.html';document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));}));})();</script></body></html>
