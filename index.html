<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<title>進化ダンジョン</title>
<style>
html,body{margin:0;height:100%;background:#070b12;color:#fff;font-family:system-ui,-apple-system,sans-serif}
main{min-height:100%;display:grid;place-items:center;padding:24px;text-align:center;background:radial-gradient(circle at 50% 20%,#172336,#070b12 60%)}
.card{max-width:720px;border:1px solid #7d5a33;border-radius:18px;padding:28px;background:#0c121bdd;box-shadow:0 20px 60px #0008}
h1{margin:0 0 8px;color:#f0d4a0}.tag{opacity:.7}.ok{margin-top:20px;color:#8dd8ff}
</style>
</head>
<body>
<main><section class="card">
<h1>進化ダンジョン</h1>
<div class="tag">GitHub版 開発環境</div>
<p>リポジトリ連携に成功しました。ここからゲーム本体と画像素材を順番に追加します。</p>
<p class="ok">✓ GitHubへの書き込み確認済み</p>
</section></main>
</body></html>
