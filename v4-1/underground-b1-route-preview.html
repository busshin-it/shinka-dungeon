<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>地下迷宮B1｜分岐マップ試作</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0b1421;color:#e9edf5}
*{box-sizing:border-box}body{margin:0;padding:18px}main{max-width:640px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:21px;margin:0}.sub{color:#b6c5d6;font-size:13px;margin:8px 0 20px}
button{font:inherit;cursor:pointer}header button{background:#293b51;color:white;border:1px solid #7187a0;border-radius:8px;padding:9px 12px}
#status{border:1px solid #667995;background:#1b293e;padding:12px;border-radius:10px;position:sticky;top:0;z-index:4;margin-bottom:14px}
#map{display:flex;flex-direction:column;gap:16px;padding:20px 4px 30px}
.floor{display:grid;grid-template-columns:34px repeat(3,minmax(0,1fr));gap:7px;align-items:center;position:relative}
.floor-label{font-size:12px;color:#c1cbd8;text-align:right;padding-right:3px}
.room{border:1px solid #526581;border-radius:12px;background:#202f43;color:#c4d0dc;padding:8px 2px;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.room .symbol{font-size:23px}.room small{font-size:10px}.room:disabled{cursor:default;opacity:.55}
.room.available{background:#44351d;border:2px solid #ffcc75;color:#ffdfac;box-shadow:0 0 10px #c9983755;opacity:1}
.room.done{background:#26493d;border-color:#75c59f;color:#c8f8e2;opacity:1}
.room.selected{border:2px solid #faad51}
.boss{max-width:230px;margin:0 auto 6px;min-height:70px;width:100%;display:block;background:#582e37;border:2px solid #e79886;color:white;border-radius:15px;font-size:19px}
.boss:disabled{opacity:.55}p.note{font-size:12px;line-height:1.7;color:#abb8c9}
#combat,#choices{background:#15243a;border:1px solid #677a92;border-radius:14px;padding:14px;margin:12px 0}#combat[hidden],#choices[hidden]{display:none}#enemies,#hand,#choiceList{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.choice,#hand button,#enemies button{background:#29394f;border:1px solid #7188a4;color:white;border-radius:9px;padding:11px;text-align:left;flex:1 1 135px;min-width:110px}#enemies .target{border-color:#f6ba64;background:#3c3441}#hand button:disabled{opacity:.35}#endTurn{padding:12px;background:#da9d48;border:0;border-radius:9px;font-weight:bold}#battleInfo{line-height:1.8}#map{scroll-margin-top:90px}.room{position:relative}.route-edges{pointer-events:none;position:absolute;top:-17px;left:0;width:100%;height:18px;overflow:visible}.route-edges line{stroke:#b9a476;stroke-width:2;stroke-dasharray:4 3;opacity:.65}.route-edges line.passed{stroke:#81d3aa;opacity:1;stroke-width:3}button:focus-visible{outline:3px solid #ffcf80;outline-offset:2px}
</style></head><body><main>
<header><h1>地下迷宮 B1｜進路選択</h1><button id="restart" type="button">新しい地図</button></header>
<p class="sub">下から上へ登る15階層。金色の部屋を選んで、戦闘や休憩を進めます。</p>
<div id="status" role="status" aria-live="polite"></div><section id="combat" hidden aria-label="戦闘"><div id="battleInfo"></div><div id="enemies"></div><div id="hand"></div><button id="endTurn" type="button">ターン終了</button></section><section id="choices" hidden><h2 id="choiceTitle"></h2><div id="choiceList"></div></section><div id="map" aria-label="分岐マップ"></div>
<p class="note">この15階層は試遊モードです。既存B1のカード・敵AIを使用しますが、本編12戦と保存データは変更しません。ページを閉じると試遊は終了します。</p>
</main><script type="module">
import {createB1RouteMap,availableB1Rooms,chooseB1Room} from "./underground-b1-route-map.mjs";
import {createB1Game,getB1Card,B1_WEAPONS} from "./underground-b1-engine.mjs";
const $=id=>document.getElementById(id);
const labels={battle:["⚔","戦闘"],elite:["☠","強敵"],event:["?","イベント"],shop:["＄","商人"],rest:["♨","休憩"],treasure:["◆","宝箱"]};
let seed=(Date.now()>>>0)||1,map=createB1RouteMap(seed),path=[],game=createB1Game({seed,tacticalEncounters:true,weaponTrial:true,routeTrial:true}),selectedEnemy=null,pendingRoom=null;
function button(text,onClick,cls="choice"){const b=document.createElement("button");b.type="button";b.className=cls;b.textContent=text;b.addEventListener("click",onClick);return b;}
function showChoice(title,options){$("choices").hidden=false;$("combat").hidden=true;$("choiceTitle").textContent=title;$("choiceList").replaceChildren(...options.map(([t,fn])=>button(t,fn)));}
function handleRoom(id,type){
 if(game.snapshot().phase==="starter"&&type!=="battle")return;
 if(type==="battle"&&game.snapshot().phase==="starter"){pendingRoom=id;showChoice("冒険を始める｜最初のデッキ",[
  ["基本デッキ",()=>beginStarter("basic")],["雷デッキ",()=>beginStarter("lightning")],
  ["物理デッキ",()=>beginStarter("physical")],["竜の卵デッキ",()=>beginStarter("dragonEgg")]
 ]);return;}
 if(!game.enterRouteRoom(type))return;
 const next=chooseB1Room(map,path,id);if(!next)return;path=next;
 if(type==="event"){game.routeLeaveRoom();}
 render();
}
function beginStarter(starter){if(!game.selectStarter(starter))return;const next=chooseB1Room(map,path,pendingRoom);if(!next)return;path=next;pendingRoom=null;render();}
function finishNonCombat(){if(game.routeLeaveRoom())render();}
function render(){
 const s=game.snapshot(),available=new Set(s.phase==="battle"||s.phase==="reward"||s.weaponPending||s.restPending||s.shopPending||s.phase==="won"||s.phase==="lost"?[]:availableB1Rooms(map,path));
 $("status").textContent=`踏破 ${path.filter(x=>x!=="boss").length}/15階｜HP ${s.hp}/${s.maxHp}｜金貨 ${s.gold}G｜${s.phase==="battle"?"戦闘中":s.phase==="reward"?"戦利品選択":s.phase==="lost"?"冒険失敗":s.phase==="won"?"踏破成功":"次の部屋を選択"}`;
 $("combat").hidden=true;$("choices").hidden=true;
 if(s.phase==="battle")renderCombat(s);
 else if(s.phase==="reward")showChoice("勝利！カード報酬",[
  ...s.rewards.map(id=>{const card=getB1Card(id);return [card.name+"｜"+card.text,()=>{if(game.chooseReward(id))render();}];}),
  ["見送る",()=>{if(game.chooseReward(null))render();}]
 ]);
 else if(s.phase==="lost"||s.phase==="won")showChoice(s.phase==="won"?"ボス撃破！":"冒険失敗", [["新しい冒険",restart]]);
 else if(s.weaponPending)showChoice("宝箱｜武器を選ぶ",[
  ...s.weaponOffered.map(id=>[B1_WEAPONS[id].name+"｜"+B1_WEAPONS[id].text,()=>{if(game.chooseWeapon(id)){finishNonCombat();}}]),
  ["見送る",()=>{if(game.chooseWeapon(null))finishNonCombat();}]
 ]);
 else if(s.restPending)showChoice("休憩所",[
  ["HPを15回復",()=>{if(game.chooseRest("heal"))finishNonCombat();}],
  ...s.deck.map((id,i)=>{const card=getB1Card(id);return [card.name+" を強化",()=>{if(game.chooseRest("upgrade",i))finishNonCombat();}];}).filter((_,i)=>!s.deck[i].endsWith("~")),
  ["休憩を見送る",finishNonCombat]
 ]);
 else if(s.shopPending)showChoice("商人｜所持金 "+s.gold+"G",[
  ...s.shopStock.map(item=>{const card=getB1Card(item.id);return [card.name+" "+item.price+"G",()=>{if(game.buyShop(item.id))render();}];}),
  ["商店を出る",()=>{if(game.leaveShop())render();}]
 ]);
 const container=$("map");container.replaceChildren();
 const boss=button("♛ 16階｜ボス",()=>handleRoom("boss","boss"),"boss");boss.disabled=!available.has("boss");container.append(boss);
 for(const nodes of [...map.floors].reverse()){
  const row=document.createElement("div");row.className="floor";
  const label=document.createElement("span");label.className="floor-label";label.textContent=nodes[0].floor+"F";row.append(label);
  for(const node of nodes){
   const btn=button("",()=>handleRoom(node.id,node.type),"room");
   const [symbol,name]=labels[node.type],done=path.includes(node.id),enabled=available.has(node.id);
   btn.className+=" "+(done?"done":enabled?"available":"");btn.disabled=!enabled;
   btn.setAttribute("aria-label",node.floor+"階 "+name+(done?" 通過済み":enabled?" 選択可能":""));
   const ico=document.createElement("span");ico.className="symbol";ico.textContent=done?"✓":symbol;
   const label=document.createElement("small");label.textContent=name;btn.append(ico,label);row.append(btn);
  }
  container.append(row);
 }
 // Draw true graph edges instead of suggesting connections that do not exist.
 const rows=[...container.querySelectorAll(".floor")];
 for(let index=1;index<rows.length;index++){
  const row=rows[index],upper=rows[index-1],floor=16-index;
  const nodes=map.floors[floor-1],upperNodes=map.floors[floor];
  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("class","route-edges");
  const box=row.getBoundingClientRect();svg.setAttribute("viewBox","0 0 "+box.width+" 18");svg.setAttribute("preserveAspectRatio","none");
  const lowerButtons=row.querySelectorAll(".room"),upperButtons=upper.querySelectorAll(".room");
  for(const node of nodes){
   for(const next of node.next){
    const target=upperNodes.find(n=>n.id===next);if(!target)continue;
    const a=lowerButtons[node.lane].getBoundingClientRect(),b=upperButtons[target.lane].getBoundingClientRect();
    const line=document.createElementNS("http://www.w3.org/2000/svg","line");
    line.setAttribute("x1",a.left-box.left+a.width/2);line.setAttribute("y1","18");
    line.setAttribute("x2",b.left-box.left+b.width/2);line.setAttribute("y2","0");
    if(path.includes(node.id)&&path.includes(target.id))line.setAttribute("class","passed");
    svg.append(line);
   }
  }
  row.append(svg);
 }
 if(!path.length)window.scrollTo(0,document.body.scrollHeight);
 else if(s.phase!=="battle"){const current=container.querySelectorAll(".floor");const active=[...current].find(row=>row.querySelector(".done")&&row.textContent.includes(String(path.length)));if(active&&path.length>0)active.scrollIntoView({block:"center",behavior:"instant"});}
}
function renderCombat(s){
 $("combat").hidden=false;
 $("battleInfo").textContent=`第${path.length}階の戦闘｜HP ${s.hp}/${s.maxHp}｜防御${s.block}｜魔力${s.energy}｜ターン${s.turn}｜${s.log[0]||""}`;
 const enemyList=$("enemies");enemyList.replaceChildren();
 for(const enemy of s.enemies.filter(e=>e.hp>0)){
  const intent=s.intents.find(i=>i.id===enemy.id);
  const b=button(enemy.name+" HP "+enemy.hp+"/"+enemy.maxHp+"｜予告 "+(intent?.label||""),()=>{selectedEnemy=enemy.id;render();});
  if(selectedEnemy===enemy.id)b.classList.add("target");enemyList.append(b);
 }
 if(!s.enemies.some(e=>e.id===selectedEnemy&&e.hp>0))selectedEnemy=s.enemies.find(e=>e.hp>0)?.id||null;
 const hand=$("hand");hand.replaceChildren();
 s.hand.forEach((id,index)=>{const card=getB1Card(id),b=button(card.name+"（"+card.cost+"）｜"+card.text,()=>{if(game.play(index,selectedEnemy))render();});b.disabled=card.cost>s.energy;hand.append(b);});
}
function restart(){seed=(seed+977)>>>0;map=createB1RouteMap(seed);path=[];game=createB1Game({seed,tacticalEncounters:true,weaponTrial:true,routeTrial:true});pendingRoom=null;selectedEnemy=null;render();}
$("endTurn").addEventListener("click",()=>{if(game.endTurn())render();});
$("restart").addEventListener("click",restart);
render();
</script></body></html>
